name: Phase gates
on:
  push:
    branches: [main]
    paths:
      - "docs/PHASE_GATES.json"
      - "config/port_identity.json"
      - "tools/check_phase_gates.py"
      - ".github/workflows/phase-gates.yml"
      - "docs/PORTING_PLAN.md"
  pull_request:
permissions:
  contents: read
jobs:
  phase-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python checker syntax (no game assets required)
        run: python3 -m py_compile tools/check_phase_gates.py tools/verify_source_pair.py
      - name: Verify sequential owner-approved gates and World source identity
        run: python3 tools/check_phase_gates.py
